<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prompt Stüdyosu</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 20px;
    background: radial-gradient(1000px 600px at 20% -10%, #2a0f2e 0%, #07050A 60%);
    color: #fff; font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); letter-spacing: -.02em; margin: 0 0 6px; }
  .sub { color: #ffffff8c; margin: 0 0 28px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; }
  input {
    flex: 1 1 240px; min-width: 0; padding: 14px 16px; font: inherit; color: #fff;
    background: #ffffff0d; border: 1px solid #ffffff1f; border-radius: 999px; outline: none;
  }
  input:focus { border-color: #F472A6; box-shadow: 0 0 0 3px #ec489933; }
  button {
    padding: 14px 26px; font: 600 15px/1 inherit; color: #fff; cursor: pointer;
    background: linear-gradient(100deg, #EC4899, #A855F7); border: 0; border-radius: 999px;
    transition: transform .2s, opacity .2s;
  }
  button:hover:not(:disabled) { transform: scale(1.03); }
  button:disabled { opacity: .55; cursor: progress; }
  .card {
    margin-top: 26px; padding: 20px; border: 1px solid #ffffff14;
    border-radius: 20px; background: #ffffff08;
  }
  .card h2 {
    margin: 0 0 10px; font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: #FBA6C3;
  }
  pre {
    margin: 0; padding: 14px; white-space: pre-wrap; word-break: break-word;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #ffffffcc; background: #00000059; border-radius: 12px;
  }
  img { display: block; width: 100%; border-radius: 14px; }
  .err { border-color: #f8717155; background: #f871711a; color: #fca5a5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Prompt Stüdyosu</h1>
    <p class="sub">Kısa bir tarif yazın; Claude bunu detaylı bir görsel prompt'una çevirsin, ardından görsel üretilsin.</p>

    <form id="form">
      <input id="input" name="input" maxlength="500" placeholder="örn. utangaç sevgili" required autocomplete="off" />
      <button id="submit" type="submit">Üret</button>
    </form>

    <section class="card" id="promptCard" hidden>
      <h2>Oluşturulan prompt</h2>
      <pre id="promptText"></pre>
    </section>

    <section class="card" id="imageCard" hidden>
      <h2>Görsel</h2>
      <img id="image" alt="Üretilen görsel" />
    </section>

    <section class="card err" id="errorCard" hidden>
      <h2>Hata</h2>
      <pre id="errorText"></pre>
    </section>
  </main>

<script type="module">
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const submit = document.getElementById("submit");
  const cards = {
    prompt: document.getElementById("promptCard"),
    image: document.getElementById("imageCard"),
    error: document.getElementById("errorCard"),
  };

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    for (const card of Object.values(cards)) card.hidden = true;
    submit.disabled = true;
    submit.textContent = "Üretiliyor…";

    try {
      // 1) Girdi → prompt (Claude)
      const prompt = await post("/api/prompt", { input: input.value.trim() }).then((r) => r.prompt);
      document.getElementById("promptText").textContent = prompt;
      cards.prompt.hidden = false;

      // 2) Prompt → görsel
      const { dataUrl } = await post("/api/image", { prompt });
      document.getElementById("image").src = dataUrl;
      cards.image.hidden = false;
    } catch (err) {
      document.getElementById("errorText").textContent = err.message;
      cards.error.hidden = false;
    } finally {
      submit.disabled = false;
      submit.textContent = "Üret";
    }
  });

  async function post(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error ?? `İstek başarısız (${res.status})`);
    return json;
  }
</script>
</body>
</html>
